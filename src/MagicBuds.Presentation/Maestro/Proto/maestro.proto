// Pixel Buds "Maestro" messages, trimmed to what the app uses.
//
// Based on maestro_pw.proto from pbpctrl (https://github.com/qzed/pbpctrl, MIT/Apache-2.0),
// plus the Pro 2 head gestures setting (29) captured from mypixelbuds.google.com.
// See docs/protocol/notes.md.

syntax = "proto3";

package maestro_pw;

option csharp_namespace = "MagicBuds.Presentation.Maestro.Proto";

// Pigweed RPC envelope every message travels in
message RpcPacket {
    PacketType type = 1;
    uint32 channel_id = 2;
    fixed32 service_id = 3;
    fixed32 method_id = 4;
    bytes payload = 5;
    uint32 status = 6;
    uint32 call_id = 7;
}

enum PacketType {
    REQUEST = 0;
    RESPONSE = 1;
    CLIENT_STREAM = 2;
    DEPRECATED_SERVER_STREAM_END = 3;
    CLIENT_ERROR = 4;
    SERVER_ERROR = 5;
    DEPRECATED_CANCEL = 6;
    SERVER_STREAM = 7;
    CLIENT_STREAM_END = 8;
}

// Battery and placement, streamed by SubscribeRuntimeInfo
message RuntimeInfo {
    int64 timestamp_ms = 2;
    BatteryInfo battery_info = 6;
    PlacementInfo placement = 7;
}

message BatteryInfo {
    DeviceBatteryInfo case = 1;
    DeviceBatteryInfo left = 2;
    DeviceBatteryInfo right = 3;
}

message DeviceBatteryInfo {
    int32 level = 1;
    BatteryState state = 2;
}

enum BatteryState {
    BATTERY_STATE_UNKNOWN = 0;
    BATTERY_NOT_CHARGING = 1;
    BATTERY_CHARGING = 2;
}

message PlacementInfo {
    bool right_bud_in_case = 1;
    bool left_bud_in_case = 2;
}

// Firmware versions, from GetSoftwareInfo
message SoftwareInfo {
    FirmwareInfo firmware = 4;
}

message FirmwareInfo {
    FirmwareVersion case = 1;
    FirmwareVersion right = 2;
    FirmwareVersion left = 3;
}

message FirmwareVersion {
    string version_string = 2;
}

// Settings
message ReadSettingMsg {
    SettingId settings_id = 4;
}

message WriteSettingMsg {
    SettingValue setting = 4;
}

message SettingsRsp {
    SettingValue value = 4;
}

enum SettingId {
    SETTING_UNKNOWN = 0;
    GESTURE_ENABLE = 4;
    GESTURE_CONTROL = 7;
    MULTIPOINT_ENABLE = 11;
    ANCR_GESTURE_LOOP = 12;
    CURRENT_ANCR_STATE = 13;
    CURRENT_USER_EQ = 16;
    SPEECH_DETECTION = 22;
    HEAD_GESTURES = 29;
}

message SettingValue {
    oneof value_oneof {
        bool gesture_enable = 4;
        GestureControl gesture_control = 7;
        bool multipoint_enable = 11;
        AncrGestureLoop ancr_gesture_loop = 12;
        AncState current_ancr_state = 13;
        EqBands current_user_eq = 16;
        bool speech_detection = 22;
        HeadGestureState head_gestures = 29;
    }
}

message GestureControl {
    DeviceGestureControl left = 1;
    DeviceGestureControl right = 2;
}

message DeviceGestureControl {
    GestureControlType type = 4;
}

message GestureControlType {
    RegularActionTarget value = 1;
}

enum RegularActionTarget {
    ACTION_TARGET_UNKNOWN = 0;
    ACTION_TARGET_CHECK_NOTIFICATIONS = 1;
    ACTION_TARGET_PREVIOUS_TRACK_REPEAT = 2;
    ACTION_TARGET_NEXT_TRACK = 3;
    ACTION_TARGET_PLAY_PAUSE_TRACK = 4;
    ACTION_TARGET_ANC_CONTROL = 5;
    ACTION_TARGET_ASSISTANT_QUERY = 6;
}

message AncrGestureLoop {
    bool active = 1;
    bool off = 2;
    bool aware = 3;
    bool adaptive = 4;
}

enum AncState {
    ANC_STATE_UNKNOWN = 0;
    ANC_STATE_OFF = 1;
    ANC_STATE_ACTIVE = 2;
    ANC_STATE_AWARE = 3;
    ANC_STATE_ADAPTIVE = 4;
}

// Gains in dB, -6 to 6 in steps of 0.5
message EqBands {
    float low_bass = 1;
    float bass = 2;
    float mid = 3;
    float treble = 4;
    float upper_treble = 5;
}

enum HeadGestureState {
    HEAD_GESTURES_UNKNOWN = 0;
    HEAD_GESTURES_OFF = 1;
    HEAD_GESTURES_ON = 2;
}
